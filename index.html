<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="왕사녀 캘린더">
  <meta property="og:title" content="왕사녀 캘린더">
  <meta property="og:description" content="THE KING'S LADY 일정 관리 캘린더">
  <meta property="og:image" content="og_image.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="앱아이콘.png">
  <link rel="icon" href="앱아이콘.png">
  <title>왕사녀 캘린더</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;overflow:hidden;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif}
    :root{
      --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3350;
      --text:#e8eaf6;--muted:#8892b0;--sub:#4a5270;--accent:#7c8cf8;
      --header:#13162b;--today:#7c8cf8;--sun:#f87171;--sat:#60a5fa;
      --hol-bg:rgba(248,113,113,0.08);--modal:#1a1d27;--shadow:0 8px 40px rgba(0,0,0,0.6);
    }
    [data-theme="light"]{
      --bg:#f0f4ff;--surface:#fff;--surface2:#eef1ff;--border:#dde2f5;
      --text:#1a1d2e;--muted:#5a6280;--sub:#b0b8d8;--accent:#4f5ef7;
      --header:#fff;--today:#4f5ef7;--sun:#dc2626;--sat:#2563eb;
      --hol-bg:rgba(220,38,38,0.05);--modal:#fff;--shadow:0 8px 40px rgba(0,0,0,0.1);
    }
    body{background:var(--bg);color:var(--text)}

    /* 로그인 */
    #loginScreen{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:32px}
    .login-logo{width:100px;height:100px;border-radius:22px;object-fit:cover;box-shadow:var(--shadow)}
    .login-title{font-size:22px;font-weight:700;text-align:center;line-height:1.4}
    .login-sub{font-size:14px;color:var(--muted);text-align:center}
    .login-btn{display:flex;align-items:center;gap:10px;background:#fff;color:#3c4043;border:1px solid #dadce0;padding:12px 24px;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.1);font-family:inherit}
    .login-btn img{width:20px;height:20px}
    #loginError{font-size:13px;color:#ef4444;text-align:center;display:none}

    /* 헤더 */
    .app-header{background:var(--header);border-bottom:1px solid var(--border);padding:0 14px;height:52px;display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:100}
    .header-left{display:flex;align-items:center;gap:10px}
    .header-right{display:flex;align-items:center;gap:8px}
    .app-logo{font-size:15px;font-weight:700;color:var(--accent)}
    .month-nav{display:flex;align-items:center;gap:6px}
    .month-label{font-size:15px;font-weight:700;min-width:80px;text-align:center}
    .icon-btn{width:34px;height:34px;border-radius:50%;border:none;background:var(--surface2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all 0.15s;flex-shrink:0}
    .icon-btn:active{background:var(--accent);color:#fff;transform:scale(0.92)}

    /* 범례 */
    .legend-bar{position:fixed;top:52px;left:0;right:0;z-index:99;background:var(--header);border-bottom:1px solid var(--border);padding:5px 12px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;height:30px;align-items:center}
    .legend-bar::-webkit-scrollbar{display:none}
    .leg{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap}
    .leg-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}

    /* 캘린더 */
    .cal-container{position:fixed;top:82px;left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden}
    .cal-header{display:grid;grid-template-columns:repeat(7,1fr);background:var(--header);border-bottom:1px solid var(--border);flex-shrink:0}
    .cal-dow{padding:6px 0;text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
    .cal-dow.sun{color:var(--sun)} .cal-dow.sat{color:var(--sat)}
    .cal-body{flex:1;display:grid;grid-template-columns:repeat(7,1fr);overflow:hidden;position:relative}
    @keyframes slideInRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes slideInLeft{from{transform:translateX(-100%);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes slideOutLeft{from{transform:translateX(0);opacity:1}to{transform:translateX(-100%);opacity:0}}
    @keyframes slideOutRight{from{transform:translateX(0);opacity:1}to{transform:translateX(100%);opacity:0}}
    .cal-body.slide-in-right{animation:slideInRight 0.28s cubic-bezier(0.4,0,0.2,1)}
    .cal-body.slide-in-left{animation:slideInLeft 0.28s cubic-bezier(0.4,0,0.2,1)}
    .cal-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;cursor:pointer;overflow:hidden;transition:background 0.1s}
    .cal-cell:active{background:var(--surface2)}
    .cal-cell.other{background:var(--bg);opacity:0.5}
    .cal-cell.is-holiday{background:var(--hol-bg)}
    .cal-cell.is-today .cell-num{background:var(--today);color:#fff!important;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-weight:700}
    .cell-top{padding:3px 3px 2px;display:flex;flex-direction:column;align-items:center;flex-shrink:0}
    .cell-num{font-size:12px;font-weight:600;color:var(--muted);width:22px;height:22px;display:flex;align-items:center;justify-content:center}
    .cal-cell.sunday .cell-num{color:var(--sun)} .cal-cell.saturday .cell-num{color:var(--sat)}
    .cal-cell.is-holiday .cell-num{color:var(--sun)}
    .hol-tag{font-size:8px;color:var(--sun);font-weight:700;text-align:center;line-height:1.1;margin-top:1px;word-break:keep-all;max-width:100%}
    .cell-events{flex:1;padding:1px 2px;display:flex;flex-direction:column;gap:1px;overflow:hidden}
    .ev{border-radius:3px;font-size:10px;font-weight:700;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:14px}
    .ev:active{opacity:0.7}
    .ev-more{font-size:9px;color:var(--accent);font-weight:700;padding:0 3px;cursor:pointer}

    /* FAB */
    .fab{position:fixed;bottom:22px;right:18px;z-index:200;width:54px;height:54px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:28px;cursor:pointer;box-shadow:0 4px 20px rgba(124,140,248,0.5);display:flex;align-items:center;justify-content:center;transition:transform 0.15s}
    .fab:active{transform:scale(0.88)}

    /* 바텀시트 */
    .sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);z-index:300;opacity:0;pointer-events:none;transition:opacity 0.25s}
    .sheet-overlay.open{opacity:1;pointer-events:all}
    .sheet{position:fixed;left:0;right:0;bottom:0;z-index:301;background:var(--modal);border-radius:24px 24px 0 0;padding:0 16px 36px;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);box-shadow:var(--shadow)}
    .sheet.open{transform:translateY(0)}
    .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 16px}
    .sheet-title{font-size:17px;font-weight:700;margin-bottom:18px}
    .form-group{margin-bottom:13px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .form-label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:5px}
    .form-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-family:inherit;font-size:15px;transition:border-color 0.2s;outline:none}
    .form-input:focus{border-color:var(--accent)}
    .form-input::placeholder{color:var(--sub)}
    .form-footer{display:flex;gap:8px;margin-top:18px}
    .btn{padding:13px 20px;border-radius:12px;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;transition:all 0.15s}
    .btn-full{flex:1}
    .btn-primary{background:var(--accent);color:#fff}
    .btn-primary:active{opacity:0.85;transform:scale(0.98)}
    .btn-ghost{background:var(--surface2);color:var(--muted);border:1.5px solid var(--border)}
    .btn-danger{background:#ef4444;color:#fff}
    .btn-sm{padding:7px 14px;font-size:12px;border-radius:10px}
    .detail-cat{display:inline-flex;align-items:center;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:16px}
    .detail-row{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
    .detail-lbl{font-size:12px;color:var(--muted);min-width:48px;padding-top:1px;font-weight:600}
    .detail-val{font-size:14px;flex:1;line-height:1.6}
    .detail-link{color:var(--accent);text-decoration:none;word-break:break-all}
    .detail-actions{display:flex;gap:8px;margin-top:18px;padding-top:18px;border-top:1px solid var(--border)}
    .day-ev-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
    .day-ev-item:last-child{border:none}
    .day-ev-cat{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;white-space:nowrap;flex-shrink:0}
    .day-ev-name{font-size:14px;font-weight:600;flex:1}
    .confirm-inner{text-align:center;padding:8px 0 4px}
    .confirm-icon{font-size:38px;margin-bottom:10px}
    .confirm-ttl{font-size:16px;font-weight:700;margin-bottom:8px}
    .confirm-msg{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.7;white-space:pre-line}
    .confirm-btns{display:flex;gap:8px;justify-content:center}

    /* 설정 */
    .settings-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:400;opacity:0;pointer-events:none;transition:opacity 0.25s}
    .settings-overlay.open{opacity:1;pointer-events:all}
    .settings-panel{position:fixed;top:0;right:-100%;bottom:0;width:85%;max-width:360px;background:var(--modal);z-index:401;box-shadow:var(--shadow);transition:right 0.3s cubic-bezier(0.4,0,0.2,1);overflow-y:auto}
    .settings-panel.open{right:0}
    .settings-hdr{padding:52px 18px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .settings-section{padding:18px;border-bottom:1px solid var(--border)}
    .settings-sec-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px}
    .theme-row{display:flex;background:var(--surface2);border:1.5px solid var(--border);border-radius:20px;padding:3px;gap:3px}
    .theme-opt{flex:1;text-align:center;padding:8px;border-radius:16px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s}
    .theme-opt.active{background:var(--accent);color:#fff}
    .user-info{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
    .user-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
    .user-name{font-size:14px;font-weight:600}
    .user-email{font-size:12px;color:var(--muted);margin-top:2px}
    .logout-btn{margin:18px;width:calc(100% - 36px)}
    .trash-item{padding:13px 18px;border-bottom:1px solid var(--border)}
    .trash-name{font-size:14px;font-weight:600;margin-bottom:3px}
    .trash-meta{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.5}
    .trash-btns{display:flex;gap:6px}
    .trash-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;color:var(--muted);font-size:13px;gap:8px}

    /* 토스트 */
    .toast-wrap{position:fixed;bottom:86px;left:12px;right:12px;z-index:500;display:flex;flex-direction:column;gap:6px;pointer-events:none}
    .toast{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:12px 16px;font-size:13px;font-weight:600;box-shadow:var(--shadow);animation:toastIn 0.25s ease}
    .toast.ok{border-color:#22c55e} .toast.err{border-color:#ef4444}
    @keyframes toastIn{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
    .loading{display:flex;align-items:center;justify-content:center;height:100px;gap:8px;color:var(--muted);font-size:13px}
    .spin{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}

    @media(min-width:900px){
      .fab{display:none}
      .pc-add-btn{display:flex!important}
      .cal-cell:hover{background:var(--surface2)}
      .ev{font-size:11px;padding:2px 5px;line-height:15px}
      .cell-num{font-size:13px;width:26px;height:26px}
      .cal-cell.is-today .cell-num{width:26px;height:26px}
      .sheet{max-width:480px;left:50%;transform:translateX(-50%) translateY(100%);border-radius:24px;margin-bottom:40px}
      .sheet.open{transform:translateX(-50%) translateY(0)}
      .toast-wrap{bottom:24px;left:auto;right:24px;width:320px}
    }
  </style>
</head>
<body>

<div id="loginScreen">
  <img class="login-logo" src="앱아이콘.png" alt="왕사녀 캘린더">
  <div>
    <div class="login-title">왕사녀 캘린더</div>
    <div class="login-sub" style="margin-top:6px">THE KING'S LADY 일정 관리</div>
  </div>
  <button class="login-btn" id="loginBtn">
    <img src="https://www.google.com/favicon.ico" alt="Google">
    Google로 로그인
  </button>
  <div id="loginError">접근 권한이 없는 계정입니다.</div>

  <!-- 브라우저 안내 -->
  <div style="margin-top:8px;padding:14px 16px;background:var(--surface2);border-radius:14px;width:100%;max-width:320px">
    <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px">⚠️ 카카오톡에서 열었나요?</div>
    <div style="font-size:12px;color:var(--muted);line-height:1.7">
      카카오톡 인앱 브라우저에서는 구글 로그인이 안 됩니다.<br>
      <strong style="color:var(--text)">아이폰</strong> — 오른쪽 하단 <strong style="color:var(--text)">···</strong> → <strong style="color:var(--text)">Safari로 열기</strong><br>
      <strong style="color:var(--text)">안드로이드</strong> — 오른쪽 상단 <strong style="color:var(--text)">⋮</strong> → <strong style="color:var(--text)">다른 브라우저로 열기</strong>
    </div>
  </div>
</div>

<div id="appBody" style="display:none">
  <header class="app-header">
    <div class="header-left">
      <div class="app-logo">📅 왕사녀</div>
      <div class="month-nav">
        <button class="icon-btn" onclick="prevMonth()">‹</button>
        <div class="month-label" id="monthLabel"></div>
        <button class="icon-btn" onclick="nextMonth()">›</button>
      </div>
      <button class="icon-btn" onclick="goToday()" style="width:auto;padding:0 10px;border-radius:16px;font-size:12px;font-weight:700">오늘</button>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="openSettings()">⚙️</button>
      <button class="btn btn-primary pc-add-btn" onclick="openForm()" style="display:none;padding:8px 16px;border-radius:20px;font-size:13px">+ 일정 등록</button>
    </div>
  </header>

  <div class="legend-bar">
    <div class="leg"><div class="leg-dot" style="background:#E64A19"></div>왕사녀 라이브</div>
    <div class="leg"><div class="leg-dot" style="background:#00796B"></div>미팅</div>
    <div class="leg"><div class="leg-dot" style="background:#1565C0"></div>콘텐츠 업로드</div>
    <div class="leg"><div class="leg-dot" style="background:#7B1FA2"></div>개인일정</div>
    <div class="leg"><div class="leg-dot" style="background:#0097A7"></div>인희유튜브</div>
  </div>

  <div class="cal-container">
    <div class="cal-header">
      <div class="cal-dow sun">일</div><div class="cal-dow">월</div>
      <div class="cal-dow">화</div><div class="cal-dow">수</div>
      <div class="cal-dow">목</div><div class="cal-dow">금</div>
      <div class="cal-dow sat">토</div>
    </div>
    <div class="cal-body" id="calBody">
      <div style="grid-column:1/-1" class="loading"><div class="spin"></div> 불러오는 중...</div>
    </div>
  </div>

  <button class="fab" onclick="openForm()">+</button>

  <!-- 등록/수정 -->
  <div class="sheet-overlay" id="formSheetOverlay" onclick="closeSheet('formSheet')"></div>
  <div class="sheet" id="formSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="formTitle">📝 일정 등록</div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">시작일 *</label><input type="date" class="form-input" id="fStart"></div>
      <div class="form-group"><label class="form-label">종료일</label><input type="date" class="form-input" id="fEnd"></div>
    </div>
    <div class="form-group"><label class="form-label">이벤트명 *</label><input type="text" class="form-input" id="fName" placeholder="이벤트 이름"></div>
    <div class="form-group">
      <label class="form-label">카테고리 *</label>
      <select class="form-input" id="fCat">
        <option value="">선택해주세요</option>
        <option value="왕사녀 라이브">왕사녀 라이브</option>
        <option value="미팅">미팅</option>
        <option value="콘텐츠 업로드">콘텐츠 업로드</option>
        <option value="개인일정">개인일정</option>
        <option value="인희유튜브">인희유튜브</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">관련 링크</label><input type="url" class="form-input" id="fLink" placeholder="https://..."></div>
    <div class="form-group"><label class="form-label">비고</label><input type="text" class="form-input" id="fNote" placeholder="추가 메모"></div>
    <div class="form-footer">
      <button class="btn btn-ghost btn-full" onclick="closeSheet('formSheet')">취소</button>
      <button class="btn btn-primary btn-full" id="submitBtn" onclick="submitForm()">등록</button>
    </div>
  </div>

  <!-- 상세보기 -->
  <div class="sheet-overlay" id="detailSheetOverlay" onclick="closeSheet('detailSheet')"></div>
  <div class="sheet" id="detailSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="detailTitle"></div>
    <div id="detailBody"></div>
    <button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeSheet('detailSheet')">닫기</button>
  </div>

  <!-- 날짜별 목록 -->
  <div class="sheet-overlay" id="dayListSheetOverlay" onclick="closeSheet('dayListSheet')"></div>
  <div class="sheet" id="dayListSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="dayListTitle"></div>
    <div id="dayListBody"></div>
    <button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="closeSheet('dayListSheet')">닫기</button>
  </div>

  <!-- 확인 -->
  <div class="sheet-overlay" id="confirmSheetOverlay" onclick="closeSheet('confirmSheet')"></div>
  <div class="sheet" id="confirmSheet">
    <div class="sheet-handle"></div>
    <div class="confirm-inner">
      <div class="confirm-icon">⚠️</div>
      <div class="confirm-ttl" id="confirmTtl"></div>
      <div class="confirm-msg" id="confirmMsg"></div>
      <div class="confirm-btns">
        <button class="btn btn-ghost" onclick="closeSheet('confirmSheet')">취소</button>
        <button class="btn btn-danger" onclick="doConfirm()">확인</button>
      </div>
    </div>
  </div>

async function sheetsGet(range){

  const res=await fetch(url);

async function sheetsWrite(method, path, body){
  const url=`${SHEETS_BASE}/${SHEET_ID}${path}`;
  const res=await fetch(url,{
    method,
    headers:{
      "Authorization":`Bearer ${accessToken}`,
      "Content-Type":"application/json",
    },
    body: body?JSON.stringify(body):undefined,
  });
  return res.json();
}

let touchStartX=0, touchStartY=0, isDragging=false, dragLocked=false;
let prevCalEl=null, nextCalEl=null;

function buildSideCalendar(offset){
  // offset: -1=이전달, 1=다음달
  let m=month+offset, y=year;
  if(m>11){m=0;y++;}
  if(m<0){m=11;y--;}

  const map=buildMapForMonth(y,m);
  const today=fmt(new Date());
  const firstDay=new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate();
  const dipv=new Date(y,m,0).getDate();
  const total=Math.ceil((firstDay+dim)/7)*7;
  const weeks=total/7;
  const bodyEl=document.querySelector(".cal-body");
  const cellH=bodyEl?Math.floor(bodyEl.offsetHeight/weeks):80;
  const maxEv=Math.max(1,Math.floor((cellH-30)/15));

  const div=document.createElement("div");
  div.style.cssText=`position:absolute;top:0;${offset>0?"left:100%":"right:100%"};width:100%;height:100%;display:grid;grid-template-columns:repeat(7,1fr);pointer-events:none`;

  let html="";
  for(let i=0;i<total;i++){
    const dow=i%7;let dn,ds,other=false;
    if(i<firstDay){dn=dipv-firstDay+i+1;const pm=m===0?12:m,py=m===0?y-1:y;ds=`${py}-${String(pm).padStart(2,"0")}-${String(dn).padStart(2,"0")}`;other=true;}
    else if(i>=firstDay+dim){dn=i-firstDay-dim+1;const nm=m===11?1:m+2,ny=m===11?y+1:y;ds=`${ny}-${String(nm).padStart(2,"0")}-${String(dn).padStart(2,"0")}`;other=true;}
    else{dn=i-firstDay+1;ds=`${y}-${String(m+1).padStart(2,"0")}-${String(dn).padStart(2,"0")}`;}
    const isToday=ds===today,isHol=!!HOLIDAYS[ds],isSun=dow===0,isSat=dow===6;
    const evs=map[ds]||[];
    let cls="cal-cell"+(other?" other":"")+(isToday?" is-today":"")+(isHol?" is-holiday":"")+(isSun?" sunday":"")+(isSat?" saturday":"");
    html+=`<div class="${cls}" style="height:${cellH}px">`;
    html+=`<div class="cell-top"><div class="cell-num">${dn}</div>`;
    if(isHol)html+=`<div class="hol-tag">${HOLIDAYS[ds]}</div>`;
    html+=`</div><div class="cell-events">`;
    evs.slice(0,maxEv).forEach(ev=>{const c=CATS[ev.category]||{bg:"#546E7A",fg:"#fff"};html+=`<div class="ev" style="background:${c.bg};color:${c.fg}">${ev.name}</div>`;});
    if(evs.length>maxEv)html+=`<div class="ev-more">+${evs.length-maxEv}개</div>`;
    html+=`</div></div>`;
  }
  div.innerHTML=html;
  return div;
}

function buildMapForMonth(y,m){
  const map={};
  events.forEach(ev=>{
    let s=new Date(ev.startDate),e=new Date(ev.endDate||ev.startDate);
    for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1)){
      const ds=fmt(d);if(!map[ds])map[ds]=[];map[ds].push(ev);
    }
  });
  return map;
}

document.addEventListener("touchstart",e=>{
  if(document.querySelector(".sheet.open"))return;
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
  isDragging=false; dragLocked=false;
  prevCalEl=null; nextCalEl=null;
},{passive:true});

document.addEventListener("touchmove",e=>{
  if(document.querySelector(".sheet.open"))return;
  const dx=e.touches[0].clientX-touchStartX;
  const dy=e.touches[0].clientY-touchStartY;
  if(!isDragging && Math.abs(dy)>Math.abs(dx)){dragLocked=true;return;}
  if(dragLocked)return;
  if(Math.abs(dx)>8 && !isDragging){
    isDragging=true;
    const body=document.getElementById("calBody");
    // 사이드 캘린더 미리 생성
    prevCalEl=buildSideCalendar(-1);
    nextCalEl=buildSideCalendar(1);
    body.appendChild(prevCalEl);
    body.appendChild(nextCalEl);
  }
  if(!isDragging)return;
  const body=document.getElementById("calBody");
  body.style.transform=`translateX(${dx}px)`;
  body.style.transition="none";
},{passive:true});

document.addEventListener("touchend",e=>{
  if(!isDragging)return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  const body=document.getElementById("calBody");
  const threshold=window.innerWidth*0.3;

  // 사이드 캘린더 제거
  if(prevCalEl)prevCalEl.remove();
  if(nextCalEl)nextCalEl.remove();

  if(Math.abs(dx)>threshold){
    body.style.transition="transform 0.25s cubic-bezier(0.4,0,0.2,1)";
    body.style.transform=`translateX(${dx<0?"-100%":"100%"})`;
    setTimeout(()=>{
      body.style.transition="none";
      body.style.transform="translateX(0)";
      if(dx<0){month++;if(month>11){month=0;year++;}}
      else{month--;if(month<0){month=11;year--;}}
      render();
      body.style.transform=`translateX(${dx<0?"100%":"-100%"})`;
      void body.offsetWidth;
      body.style.transition="transform 0.25s cubic-bezier(0.4,0,0.2,1)";
      body.style.transform="translateX(0)";
      setTimeout(()=>body.style.transition="",280);
    },250);
  }else{
    body.style.transition="transform 0.3s cubic-bezier(0.4,0,0.2,1)";
    body.style.transform="translateX(0)";
    setTimeout(()=>body.style.transition="",320);
  }
  isDragging=false;
},{passive:true});
function handleCell(ds){openForm(ds);}
function prevMonth(){
  month--;if(month<0){month=11;year--;}
  renderWithAnim("left");
}
function nextMonth(){
  month++;if(month>11){month=0;year++;}
  renderWithAnim("right");
}
function goToday(){const n=new Date();year=n.getFullYear();month=n.getMonth();render();}

function renderWithAnim(dir){
  const body=document.getElementById("calBody");

  render();

  body.classList.add(dir==="right"?"slide-in-right":"slide-in-left");
  setTimeout(()=>body.classList.remove("slide-in-right","slide-in-left"),300);
}

async function submitForm(){
  if(!accessToken){
    tokenClient.requestAccessToken({prompt:""});
    // 토큰 받을 때까지 잠시 대기 후 자동 재시도
    toast("로그인 확인 중...","ok");
    setTimeout(()=>submitForm(),2000);
    return;
  }
  const start=document.getElementById("fStart").value;
  const end=document.getElementById("fEnd").value;
  const name=document.getElementById("fName").value.trim();
  const category=document.getElementById("fCat").value;
  const link=document.getElementById("fLink").value.trim();
  const note=document.getElementById("fNote").value.trim();
  if(!start||!name||!category){toast("⚠ 시작일, 이벤트명, 카테고리는 필수입니다.","err");return;}
  const btn=document.getElementById("submitBtn");
  btn.textContent="처리중...";btn.disabled=true;

  try{
    if(editId){
      // 수정: 해당 행 찾아서 업데이트
      const rowIdx=events.findIndex(e=>e.id===editId);
      if(rowIdx===-1){toast("이벤트를 찾을 수 없습니다.","err");btn.disabled=false;btn.textContent="수정";return;}
      const sheetRow=rowIdx+2;
      await sheetsWrite("PUT",`/values/%EC%9D%B4%EB%B2%A4%ED%8A%B8!B${sheetRow}:G${sheetRow}?valueInputOption=RAW`,{
        values:[[start,end||start,name,category,link,note]]
      });
    }else{
      // 등록: 새 행 추가
      const id=uuid();
      const now=fmt(new Date());
      await sheetsWrite("POST",`/values/%EC%9D%B4%EB%B2%A4%ED%8A%B8!A:H:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,{
        values:[[id,start,end||start,name,category,link,note,now]]
      });
    }
    btn.disabled=false;btn.textContent=editId?"수정":"등록";
    closeSheet("formSheet");
    toast("✅ "+(editId?"수정":"등록")+" 완료!","ok");
    await loadEvents();render();
  }catch(e){
    btn.disabled=false;btn.textContent=editId?"수정":"등록";
    toast("오류: "+e.message,"err");
  }
}

async function deleteEv(id,name){
  openConfirm("일정을 삭제하시겠습니까?",`"${name}"\n휴지통으로 이동됩니다. 30일 내 복구 가능합니다.`,async()=>{
    const rowIdx=events.findIndex(e=>e.id===id);
    if(rowIdx===-1)return;
    const ev=events[rowIdx];
    const now=fmt(new Date());
    try{
      // 휴지통에 추가
      await sheetsWrite("POST",`/values/%ED%9C%B4%EC%A7%80%ED%86%B5!A:I:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,{
        values:[[ev.id,ev.startDate,ev.endDate,ev.name,ev.category,ev.link,ev.note,"",now]]
      });
      // 이벤트 행 삭제 (batchUpdate)
      const sheetRow=rowIdx+2;
      await sheetsWrite("POST",`:batchUpdate`,{
        requests:[{deleteDimension:{range:{sheetId:2080466413,dimension:"ROWS",startIndex:sheetRow-1,endIndex:sheetRow}}}]
      });
      closeSheet("detailSheet");
      toast("🗑 삭제되었습니다.","ok");
      await loadEvents();render();
    }catch(e){toast("오류: "+e.message,"err");}
  });
}

// ── 캘린더 추가 선택 ──
function openCalPicker(id){
  const ev=events.find(e=>e.id===id);if(!ev)return;

  // 구글캘린더 링크 생성
  const gcalUrl=()=>{
    const base="https://calendar.google.com/calendar/render?action=TEMPLATE";
    const title=encodeURIComponent(ev.name);
    const dates=`${ev.startDate.replace(/-/g,"")}/${ev.startDate.replace(/-/g,"")}`;
    const details=encodeURIComponent([ev.note||"",ev.link||""].filter(Boolean).join("\n"));
    return `${base}&text=${title}&dates=${dates}&details=${details}`;
  };

  // .ics 생성 (아이폰용)
  const makeICS=()=>{
    const d=s=>s.replace(/-/g,"");
    const endDt=new Date(ev.endDate||ev.startDate);
    endDt.setDate(endDt.getDate()+1);
    const endStr=fmt(endDt).replace(/-/g,"");
    return [
      "BEGIN:VCALENDAR","VERSION:2.0",
      "PRODID:-//왕사녀 캘린더//KR",
      "CALSCALE:GREGORIAN","METHOD:PUBLISH",
      "BEGIN:VEVENT",
      `UID:${ev.id}@wangsanyeo`,
      `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").split(".")[0]}Z`,
      `DTSTART;VALUE=DATE:${d(ev.startDate)}`,
      `DTEND;VALUE=DATE:${endStr}`,
      `SUMMARY:${ev.name}`,
      ev.note?`DESCRIPTION:${ev.note.replace(/\n/g,"\\n")}`:"",
      ev.link?`URL:${ev.link}`:"",
      "END:VEVENT","END:VCALENDAR"
    ].filter(Boolean).join("\r\n");
  };

  document.getElementById("calPickerBody").innerHTML=`
    <div style="display:flex;flex-direction:column;gap:10px;padding:4px 0 8px">
      <button class="btn btn-ghost btn-full" style="display:flex;align-items:center;gap:12px;justify-content:flex-start;padding:14px 16px"
        onclick="window.open('${gcalUrl()}','_blank');closeSheet('calPickerSheet')">
        <img src="https://calendar.google.com/googlecalendar/images/favicons_2020q4/calendar_31.ico" style="width:24px;height:24px;border-radius:4px" onerror="this.style.display='none'">
        <div style="text-align:left">
          <div style="font-size:15px;font-weight:700;color:var(--text)">구글 캘린더</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">앱/웹으로 바로 열림</div>
        </div>
        <div style="margin-left:auto;color:var(--muted)">›</div>
      </button>
      <button class="btn btn-ghost btn-full" style="display:flex;align-items:center;gap:12px;justify-content:flex-start;padding:14px 16px"
        onclick="addToAppleCal('${id}')">
        <div style="width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;align-items:center;justify-content:center;font-size:16px">📅</div>
        <div style="text-align:left">
          <div style="font-size:15px;font-weight:700;color:var(--text)">아이폰 캘린더</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px">기본 캘린더 앱으로 바로 열림</div>
        </div>
        <div style="margin-left:auto;color:var(--muted)">›</div>
      </button>
    </div>`;
  closeSheet("detailSheet");
  setTimeout(()=>openSheet("calPickerSheet"),200);
}

function addToAppleCal(id){
  const ev=events.find(e=>e.id===id);if(!ev)return;
  const d=s=>s.replace(/-/g,"");
  const endDt=new Date(ev.endDate||ev.startDate);
  endDt.setDate(endDt.getDate()+1);
  const endStr=fmt(endDt).replace(/-/g,"");
  const ics=[
    "BEGIN:VCALENDAR","VERSION:2.0",
    "PRODID:-//왕사녀 캘린더//KR",
    "CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "BEGIN:VEVENT",
    `UID:${ev.id}@wangsanyeo`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").split(".")[0]}Z`,
    `DTSTART;VALUE=DATE:${d(ev.startDate)}`,
    `DTEND;VALUE=DATE:${endStr}`,
    `SUMMARY:${ev.name}`,
    ev.note?`DESCRIPTION:${ev.note.replace(/\n/g,"\\n")}`:"",
    ev.link?`URL:${ev.link}`:"",
    "END:VEVENT","END:VCALENDAR"
  ].filter(Boolean).join("\r\n");

  const blob=new Blob([ics],{type:"text/calendar;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  // 아이폰에서 바로 캘린더 앱 열기
  window.location.href=url;
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  closeSheet("calPickerSheet");
  toast("📅 캘린더 앱에서 확인해주세요!","ok");
}

function openDayList(ds){
  const evs=buildMap()[ds]||[];
  document.getElementById("dayListTitle").textContent=`📅 ${ds.replace(/-/g,".")} 일정`;
  document.getElementById("dayListBody").innerHTML=evs.map(ev=>{
    const c=CATS[ev.category]||{bg:"#546E7A",fg:"#fff"};
    return `<div class="day-ev-item" onclick="closeSheet('dayListSheet');setTimeout(()=>openDetail('${ev.id}'),200)">
      <div class="day-ev-cat" style="background:${c.bg};color:${c.fg}">${ev.category}</div>
      <div class="day-ev-name">${ev.name}</div>
      <div style="font-size:12px;color:var(--muted)">›</div>
    </div>`;
  }).join("");
  openSheet("dayListSheet");
}

function openConfirm(title,msg,cb){
  confirmCb=cb;
  document.getElementById("confirmTtl").textContent=title;
  document.getElementById("confirmMsg").textContent=msg;
  openSheet("confirmSheet");
}
function doConfirm(){closeSheet("confirmSheet");confirmCb&&confirmCb();}

function openSettings(){
  document.getElementById("settingsOverlay").classList.add("open");
  document.getElementById("settingsPanel").classList.add("open");
  loadTrash();
}
function closeSettings(){
  document.getElementById("settingsOverlay").classList.remove("open");
  document.getElementById("settingsPanel").classList.remove("open");
}
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  localStorage.setItem("theme",t);
  document.getElementById("themeLight")?.classList.toggle("active",t==="light");
  document.getElementById("themeDark")?.classList.toggle("active",t==="dark");
}

async function loadTrash(){
  document.getElementById("trashList").innerHTML=`<div class="loading"><div class="spin"></div></div>`;
  try{
    const data=await sheetsGet("휴지통!A2:I");
    const rows=(data.values||[]).filter(r=>r[0]);
    if(!rows.length){
      document.getElementById("trashList").innerHTML=`<div class="trash-empty"><span style="font-size:28px">🗑</span>비어있습니다</div>`;
      return;
    }
    document.getElementById("trashList").innerHTML=rows.map((r,i)=>`
      <div class="trash-item">
        <div class="trash-name">${r[3]||""}</div>
        <div class="trash-meta">${r[1]||""}${r[2]&&r[2]!==r[1]?` ~ ${r[2]}`:""} · ${r[4]||""}<br>삭제: ${r[8]||""}</div>
        <div class="trash-btns">
          <button class="btn btn-ghost btn-sm" onclick="restoreItem(${i},'${r[0]}')">↩ 복구</button>
          <button class="btn btn-danger btn-sm" onclick="permDel(${i},'${(r[3]||"").replace(/'/g,"\\'")}')">완전삭제</button>
        </div>
      </div>`).join("");
  }catch(e){document.getElementById("trashList").innerHTML=`<div class="trash-empty">불러오기 실패</div>`;}
}

async function restoreItem(rowIdx,id){
  try{
    // 휴지통 행 데이터 가져오기
    const data=await sheetsGet("휴지통!A2:H");
    const rows=(data.values||[]).filter(r=>r[0]);
    const row=rows.find(r=>r[0]===id);
    if(!row)return;
    // 이벤트 시트에 복구
    await sheetsWrite("POST",`/values/%EC%9D%B4%EB%B2%A4%ED%8A%B8!A:H:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,{
      values:[row.slice(0,8)]
    });
    // 휴지통에서 삭제
    const sheetRowIdx=rowIdx+2;
    await sheetsWrite("POST",`:batchUpdate`,{
      requests:[{deleteDimension:{range:{sheetId:765224362,dimension:"ROWS",startIndex:sheetRowIdx-1,endIndex:sheetRowIdx}}}]
    });
    toast("✅ 복구됨","ok");
    loadTrash();await loadEvents();render();
  }catch(e){toast("오류: "+e.message,"err");}
}

async function permDel(rowIdx,name){
  openConfirm("완전 삭제",`"${name}"\n완전히 삭제됩니다.`,async()=>{
    try{
      const sheetRowIdx=rowIdx+2;
      await sheetsWrite("POST",`:batchUpdate`,{
        requests:[{deleteDimension:{range:{sheetId:765224362,dimension:"ROWS",startIndex:sheetRowIdx-1,endIndex:sheetRowIdx}}}]
      });
      toast("삭제됨","ok");loadTrash();
    }catch(e){toast("오류: "+e.message,"err");}
  });
}

function toast(msg,type){
  const w=document.getElementById("toastWrap"),el=document.createElement("div");
  el.className=`toast ${type||""}`;el.textContent=msg;w.appendChild(el);
  setTimeout(()=>el.remove(),3500);
}
function fmt(d){
  if(typeof d==="string")return d.substring(0,10);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
